name: karigar_connect
description: AI-driven market linkage and smart cataloging app for artisans
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  record: ^6.1.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#F2F6FA"
  image: "assets/splash/splash_logo.png"
  android_12:
    color: "#F2F6FA"
    image: "assets/splash/splash_logo.png"
