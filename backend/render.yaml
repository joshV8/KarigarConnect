services:
  - type: web
    name: artisan-fastapi-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: artisan-postgres
          property: connectionString
      - key: AI_MODE
        value: mock
      - key: AI_SERVICE_TIMEOUT
        value: 120
      - key: ARTISAN_MARGIN_PERCENT
        value: 20

databases:
  - name: artisan-postgres
    region: oregon
    plan: free
    databaseName: artisan_db
    user: artisan_user
